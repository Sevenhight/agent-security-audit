[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit"
version = "0.1.0"
description = "LLM Agent runtime security auditing: trace-based detection of prompt injection and privilege escalation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sevenhight" }]
keywords = ["llm-security", "agent-security", "prompt-injection", "react-agent", "owasp-llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agent-audit = "agent_audit.cli:main"

[tool.setuptools.packages.find]
include = ["agent_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
