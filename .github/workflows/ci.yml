name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: pytest tests -v

      - name: Smoke test the control scenario
        run: |
          python -m agent_audit run --scenario benign --mock --run-id ci-benign
          grep -q "未检出风险" reports/ci-benign.md

      - name: Smoke test the injection scenario
        run: |
          python -m agent_audit run --scenario indirect_injection --mock --run-id ci-inject
          grep -q "严重" reports/ci-inject.md
